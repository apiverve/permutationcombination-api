[project]
name = "apiverve-permutationcombinationcalculator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Calculate permutations (P(n,r)) and combinations (C(n,r)) for any given values of n and r."
keywords = ["permutation", "combination", "nPr", "nCr", "factorial"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/permutationcombination?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/permutationcombination?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/permutationcombination-api"
Twitter = "https://twitter.com/apivervehq"
